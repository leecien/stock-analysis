# ============================================================
# 產業主題對照表：關鍵字 → 主題 → 個股
# drivers：這個主題「漲跌的典型原因」，給 AI 當推理依據
# ============================================================

themes:
  memory:
    name: 記憶體
    keywords: [記憶體, DRAM, NAND, HBM, DDR5, DDR4, 快閃記憶體, 合約價, 現貨價, 記憶體報價, memory chip, flash memory, Micron, 美光, SK海力士, SK Hynix, 三星電子]
    us: [MU, WDC, SNDK]
    tw: {2408.TW: 南亞科, 2344.TW: 華邦電, 2337.TW: 旺宏, 3260.TWO: 威剛, 8299.TWO: 群聯, 4967.TW: 十銓, 2451.TW: 創見}
    drivers:
      - 記憶體合約價、現貨價上漲 → 營收與毛利改善，股價通常領先報價反應
      - 原廠減產、庫存下降 → 供給吃緊，報價轉強
      - AI 伺服器帶動 HBM 需求，排擠一般 DRAM 產能
      - 手機、PC 需求疲弱或庫存過高 → 報價下跌

  ai_server:
    name: AI 伺服器
    keywords: [AI伺服器, AI 伺服器, GPU, 輝達, NVIDIA, Nvidia, Blackwell, Rubin, GB200, GB300, 資料中心, data center, 雲端資本支出, capex, 算力]
    us: [NVDA, AMD, SMCI, DELL]
    tw: {2382.TW: 廣達, 3231.TW: 緯創, 2317.TW: 鴻海, 6669.TW: 緯穎, 2356.TW: 英業達}
    drivers:
      - 雲端大廠（微軟、Google、亞馬遜、Meta）上修資本支出 → 伺服器訂單增加
      - 輝達財報與新平台出貨進度
      - 美國晶片出口管制 → 中國需求受限

  foundry:
    name: 晶圓代工
    keywords: [台積電, TSMC, 晶圓代工, 先進製程, 2奈米, 3奈米, 2nm, 3nm, 產能利用率, foundry, 聯電, 英特爾代工]
    us: [TSM, INTC, GFS]
    tw: {2330.TW: 台積電, 2303.TW: 聯電, 5347.TWO: 世界先進, 6770.TW: 力積電}
    drivers:
      - 先進製程需求（AI、手機晶片）→ 台積電營收與毛利
      - 成熟製程價格競爭（中國擴產）→ 聯電、世界先進承壓
      - 地緣政治與美國設廠政策

  packaging_equipment:
    name: 先進封裝與設備
    keywords: [CoWoS, 先進封裝, SoIC, 封測, 半導體設備, 曝光機, ASML, 應用材料, advanced packaging]
    us: [AMAT, LRCX, KLAC, ASML]
    tw: {3711.TW: 日月光投控, 6187.TWO: 萬潤, 3131.TWO: 弘塑}
    drivers:
      - CoWoS 產能擴充 → 設備與材料訂單
      - 晶圓廠資本支出增減

  ic_design:
    name: IC 設計
    keywords: [IC設計, 聯發科, MediaTek, ASIC, 客製化晶片, 博通, Broadcom, 高通, Qualcomm, 天璣]
    us: [AVGO, QCOM, MRVL, ARM]
    tw: {2454.TW: 聯發科, 2379.TW: 瑞昱, 3034.TW: 聯詠, 5274.TWO: 信驊, 3661.TW: 世芯-KY, 3443.TW: 創意}
    drivers:
      - 手機、PC 換機潮
      - 雲端廠自研 ASIC 晶片訂單
      - 庫存調整週期

  thermal:
    name: 散熱
    keywords: [散熱, 液冷, 水冷板, 氣冷, 散熱模組, liquid cooling]
