# ============================================================
# 總體經濟與政治因素：影響「大盤」的力量
# impact：對各主題的典型影響方向（+ 偏多、- 偏空）
# ============================================================
macro_factors:
  rate_hike:
    name: 升息 / 鷹派
    category: central_bank
    keywords: [升息, 鷹派, 緊縮, rate hike, hawkish, 縮表, 利率上升]
    impact: {market: -1, finance: +1, big_tech_software: -1, ai_server: -1}
  rate_cut:
    name: 降息 / 鴿派
    category: central_bank
    keywords: [降息, 鴿派, 寬鬆, rate cut, dovish, QE, 量化寬鬆]
    impact: {market: +1, big_tech_software: +1, finance: -1, safe_haven: +1}
  inflation:
    name: 通膨升溫
    category: macro_data
    keywords: [通膨, CPI, PCE, 物價, inflation, 核心通膨]
    impact: {market: -1, safe_haven: +1}
  recession:
    name: 景氣衰退疑慮
    category: macro_data
    keywords: [衰退, 失業率, 非農, 裁員, recession, 景氣下滑, PMI]
    impact: {market: -1, safe_haven: +1, consumer: -1}
  tariff_trade:
    name: 關稅 / 貿易戰
    category: trade
    keywords: [關稅, 貿易戰, 出口管制, 制裁, tariff, trade war, 實體清單, 232條款, 301條款]
    impact: {market: -1, apple_chain: -1, foundry: -1, steel_cement: -1}
  war_geopolitics:
    name: 戰爭 / 地緣政治
    category: war
    keywords: [戰爭, 開戰, 空襲, 飛彈, 入侵, 衝突, 台海, 共軍, 軍演, 以色列, 伊朗, 俄羅斯, 烏克蘭, 中東, war, invasion, missile]
    impact: {market: -1, defense: +1, oil_petrochem: +1, safe_haven: +1, shipping: +1, airlines: -1}
  election_policy:
    name: 選舉 / 政策
    category: politics
    keywords: [選舉, 大選, 總統, 國會, 政府關門, 債務上限, 行政命令, 立法院, election, shutdown]
    impact: {market: 0}
  pandemic:
    name: 疫情
    category: pandemic
    keywords: [疫情, 確診, 封城, 病毒, 疫苗, pandemic, lockdown]
    impact: {market: -1, airlines: -1, biotech: +1, consumer: -1}
  financial_crisis:
    name: 金融危機 / 信用風險
    category: financial_crisis
    keywords: [倒閉, 擠兌, 違約, 破產, 金融危機, 信用危機, bank run, default, bankruptcy, 流動性危機]
    impact: {market: -1, finance: -1, safe_haven: +1}
  disaster:
    name: 天災
    category: disaster
    keywords: [地震, 颱風, 停電, 海嘯, 水災, earthquake, typhoon]
    impact: {market: -1}
  china_stimulus:
    name: 中國刺激政策
    category: politics
    keywords: [中國刺激, 人行降準, 降準, 中國經濟, 陸股, 中國救市, 房地產紓困]
    impact: {market: +1, steel_cement: +1, oil_petrochem: +1}
