    keywords: [航空, 華航, 長榮航, 觀光, 旅遊, 機票, 航空貨運]
    us: [DAL, UAL]
    tw: {2610.TW: 華航, 2618.TW: 長榮航, 2731.TW: 雄獅}
    drivers:
      - 油價（成本）
