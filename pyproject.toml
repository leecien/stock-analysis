[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis"
version = "0.2.0"
description = "股票 AI 分析系統"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "yfinance>=0.2.40",
  "feedparser>=6.0",
  "requests>=2.31",
  "PyYAML>=6.0",
  "anthropic>=2.0",
  "google-genai>=1.0",
  "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
