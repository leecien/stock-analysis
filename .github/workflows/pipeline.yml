name: 每小時 AI 分析

on:
  schedule:
    - cron: "7 * * * *"   # 每小時第 7 分（UTC），台灣時間也是每小時
  workflow_dispatch:
    inputs:
      deep:
        description: "強制執行深度分析"
        type: boolean
        default: false
      history:
        description: "重建 20 年歷史事件庫"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    # 排程預設關閉：到 Settings → Secrets and variables → Actions → Variables
    # 新增 PIPELINE_ENABLED = true 才會每小時自動執行（手動執行不受影響）
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .

      - name: 取得上次的資料（data 分支）
        run: |
          mkdir -p datastore
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=datastore checkout FETCH_HEAD -- .
            git reset -q
          fi

      - name: 建立 / 更新歷史事件庫（第一次、每週一凌晨或手動）
        if: inputs.history || hashFiles('datastore/public/history.json') == ''
        run: python -m stock_analysis --state-dir datastore/state --out-dir datastore/public history

      - name: 每週更新歷史事件庫
        if: github.event_name == 'schedule'
        run: |
          if [ "$(TZ=Asia/Taipei date +%u%H)" = "103" ]; then
            python -m stock_analysis --state-dir datastore/state --out-dir datastore/public history
          fi

      - name: 每小時分析
        run: |
          python -m stock_analysis --state-dir datastore/state --out-dir datastore/public hourly ${{ inputs.deep && '--deep' || '' }}

      - name: 儲存結果到 data 分支
        run: |
          cd datastore
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
