name: 編譯 Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      # 如果有在 GitHub Secrets 設定正式簽章金鑰就使用，否則用 repo 內的固定除錯金鑰
      - name: 設定簽章金鑰（選用）
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "使用正式簽章金鑰"
          else
            echo "使用固定除錯金鑰"
          fi

      - run: flutter pub get
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: 重新命名
        run: cp build/app/outputs/flutter-apk/app-release.apk build/stock-ai-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stock-ai-apk
          path: app/build/stock-ai-${{ github.run_number }}.apk

      # 發佈到 GitHub Releases，手機打開 Releases 頁面就能下載最新版
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: App 第 ${{ github.run_number }} 版
          body: |
            手機下載下方的 APK 安裝即可（需允許「安裝不明來源的應用程式」）。
            來源 commit：${{ github.sha }}
          files: app/build/stock-ai-${{ github.run_number }}.apk
          make_latest: true
